<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>

  <body>
    <div class="container">
      <div class="sidebar">
        <div class="logo-container">
          <img
            src="./img/odin-lined.png"
            alt="The Odin Project Logo"
            width="100"
            height="125"
          >
          <h1>Odin</h1>
        </div>
        <div class="photo-credit">
          <p>
            Photo by
            <a
              href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
              >Halie West</a
            >
            on
            <a
              href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
              >Unsplash</a
            >
          </p>
        </div>
      </div>
      <div class="main-content">
        <div class="header">
          <p>
            This is not a real online service! You know you need something
            like this in your life to help you realize your deepest dreams.
            Sign up <span>now</span> to get started.
          </p>
          <p>You <span>know</span> you want to.</p>
        </div>
        <form action="#" method="get" id="sign-up-form">
          <h2>Let's do this!</h2>
          <div class="form-row">
            <div>
              <label for="first_name">First Name</label>
              <input type="text" id="first_name" name="first_name">
            </div>
            <div>
              <label for="last_name">Last Name</label>
              <input type="text" id="last_name" name="last_name">
            </div>
          </div>
          <div class="form-row">
            <div>
              <label for="user_email">Email</label>
              <input type="email" id="user_email" name="user_email">
            </div>
            <div>
              <label for="user_phone">Phone Number</label>
              <input type="tel" id="user_phone" name="user_phone">
            </div>
          </div>
          <div class="form-row">
            <div>
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required>
            </div>
            <div>
              <label for="confirm-password">Confirm Password</label>
              <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
          </div>
        </form>
        <div class="button-container">
          <button type="submit" form="sign-up-form">Create Account</button>
        </div>
        <p>Already have an account? <a href="#">Log in</a></p>
      </div>
    </div>
  </body>
</html>
